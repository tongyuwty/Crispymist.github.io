title: "My Portfolio"
description: "双语编译 · 原创内容"
url: "https://crispymist.github.io"
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "air"
locale: "zh-CN"
search: true

author:
  name: "吴桐雨"
  bio: "把复杂的世界翻译成能读懂的故事"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:tongyu.wuty@gmail.com"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true

collections:
  portfolio:
    output: true
    sort_by: date

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
